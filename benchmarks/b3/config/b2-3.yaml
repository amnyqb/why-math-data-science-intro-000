# B2-3 World3-03 (Meadows et al. 2004; NOT the 1974 DYNAMO version). No answer key: the literature that states findings
# (Thissen 1976, 1978; Taylor, Ford and Ford 2007) could not be read. Results are reported without a score.
# FROZEN before any result is looked at.
model: build/w3.sdm
steps:
  screen: {trajectories: 100, levels: 4, seed: 1, tau: 0.1, linear_cut: 0.1, converge_tau: 0.9, csv: results/b2-3/screen.csv}
  importance: {samples: 4096, seed: 1, bootstrap: 100, ensemble: 10}
  run: {series: "population,industrial output per capita,food per capita,persistent pollution index", csv: results/b2-3/base_run.csv}
  reduce: {out: build/w3_reduced.sdm, log: results/b2-3/reduction_log.csv, samples: 4096, seed: 1, st_threshold: 0.01}
  verify: {_args: [build/w3_reduced.sdm], ensemble: 100, seed: 1, max_nrmse: 0.05, min_mode_agreement: 0.9, min_goal_tau: 0.9}
