# B3-3b World3 1974 (from PyWorld3). No answer key: Thissen 1976/1978 not obtainable. Run unscored. FROZEN before any result is looked at.
# Round 2 settings: reduce with gates (transform not declared: refuses if heavy-tailed), strongest-path loop search.
model: build/w3_1974.sdm
steps:
  screen: {trajectories: 50, levels: 4, seed: 1, tau: 0.1, linear_cut: 0.1, converge_tau: 0.9, workers: 2, csv: results/b3-3b/screen.csv}
  dominance: {csv: results/b3-3b/dominance.csv}
  importance: {samples: 1024, seed: 1, bootstrap: 100, ensemble: 0, workers: 2}
  run: {series: "POP,IOPC,FPC,PPOLX,NRFR", csv: results/b3-3b/base_run.csv}
  reduce: {out: build/w3_1974_reduced.sdm, log: results/b3-3b/reduction_log.csv, samples: 1024, seed: 1, st_threshold: 0.01, workers: 2}
  verify: {_args: [build/w3_1974_reduced.sdm], ensemble: 100, seed: 1, max_nrmse: 0.05, min_mode_agreement: 0.9, min_goal_tau: 0.9}
