# Addendum key, case B3-3b (World3, 1974 version). Does not replace or change answer_key.yaml.
# Source: Thissen, W.A.H. (1978), "Investigations into the Club of Rome's World3 model: lessons for
# understanding complicated models", PhD thesis, Technische Hogeschool Eindhoven, defended 5 May 1978,
# DOI 10.6100/IR79372. This is the THESIS (140 PDF pages), not the 10-page IEEE SMC-8(3) paper it draws on.
# Page numbers below are the printed thesis page numbers (equal to the PDF page labels).
# Printed pages 116-121 (end of Sec. 3.3.4-4 on equilibrium/phase portraits, and the techniques of detailed
# analysis, decomposition and simplification, Sec. 3.3.4-2 to 3.3.4-5) are ABSENT from the supplied PDF
# (page 115 is followed directly by page 122). Unreadable/absent pages: 116, 117, 118, 119, 120, 121.
# No entry is written from those pages. Only Table 3.2 (p. 110) names the simplification techniques.
# Every number below is stated in the text (digitised: false); nothing is read off a plot.
# Thissen's own model: Algol on Burroughs B7700, first-order Euler, DT = 0.5 yr (p. 10).
# "SFPC" is stated as 230 on pp. 33 and 51 and as 220 on p. 61 (inconsistency inside the thesis).

- case: B3-3b
  finding: "Under standard-run conditions World3 is a three-level hierarchy: capital and resources (including the nonrenewable-resource stock) behave autonomously and dominate; agriculture is intermediate (driven mainly by IO, weakly by POP); population and persistent pollution are the third level, driven by IO, SO and F. Feedback from POP and FIOAA to the capital sector is weak."
  type: core_structure
  phase: "standard run, whole run to 2100"
  qualitative: true
  source: "Thissen 1978, p. 68, Sec. 2.3.1; p. 91-92, Sec. 2.5.1"
  version: &ver "World3 as in Meadows et al. 1974 (Dynamics of Growth in a Finite World, ref. 16), re-implemented by Thissen in Algol (Euler, DT 0.5 yr, 29 state variables); standard run; population sector with 4 age groups unless the entry says otherwise"

- case: B3-3b
  finding: "Freezing tests confirm the hierarchy: freezing IO and SO from 1970 makes agriculture, population and pollution come to rest (no growth and decline); freezing POP or PPOLX from 1970 hardly changes the growth-and-decline mode of the capital and agricultural variables; freezing F in 1970 changes population substantially but leaves capital and pollution virtually unchanged."
  type: core_structure
  phase: "freezes applied from 1970 in the standard run"
  qualitative: true
  source: "Thissen 1978, p. 69, Sec. 2.3.1 and Fig. 2.25 (text); p. 113, Sec. 3.3.4"
  version: *ver

- case: B3-3b
  finding: "The standard-run decline is caused by nonrenewable-resource scarcity acting through the capital sector: industrial output falls sharply once more than about 60 percent of the initial resource stock is used (the text elsewhere says capital decline starts when roughly half of NRI is used, p. 88, and that FCAOR starts to rise after more than about 40 percent is used, p. 19). The decline is then passed on to food production and population."
  type: dominant_loop
  phase: "decline phase, first half of the 21st century onward (growth turns to decline around 2025, p. 22)"
  value: "about 60 percent of initial resources used (p. 11, p. 28); about 40 percent for FCAOR to start rising (p. 19); roughly half of NRI (p. 88)"
  qualitative: false
  source: "Thissen 1978, p. 11, Sec. 2.2.1; p. 19; p. 22; p. 28, Sec. 2.2.2-5; p. 88, Sec. 2.4.3"
  version: *ver

- case: B3-3b
  finding: "Growth phase (NRFR above 0.5, FCAOR = 0.05, FIOAA = 0.12): the industrial/service capital subsystem is a positive-eigenvalue system. Linearised eigenvalues are +0.032 per year (eigenvector IC:SC = 1:0.47, about 2:3) and -0.23 per year (eigenvector 1:-1.69). IC and SC grow exponentially at about 3.2 percent per year, matching the standard run while NRFR is at least 0.5."
  type: dominant_loop
  phase: "growth phase, NRFR >= 0.5 (to about 2025)"
  value: "lambda1 = +0.032 per yr with eigenvector (1, 0.47); lambda2 = -0.23 per yr with eigenvector (1, -1.69); growth about 3.2 percent per yr"
  qualitative: false
  digitised: false
  source: "Thissen 1978, p. 23, Eq. 2.18-2.19 (a64 = -0.20, b64 = 0.30, a61 = 1.67)"
  version: *ver

- case: B3-3b
  finding: "While NRFR is above 0.5 (FCAOR = 0.05 constant) the resource stock NR has no influence at all on capital growth; the only external input to IC and SC is FIOAA. No capital growth is possible once FCAOR exceeds 0.5. For 0 <= FIOAA <= 0.4 and 0.05 <= FCAOR <= 1 the IC-SC matrix has either two negative eigenvalues or one positive and one negative eigenvalue."
  type: core_structure
  phase: "growth-to-decline transition (around 2025)"
  value: "FCAOR threshold 0.5 (NRFR = 0.5); table approximation FCAOR = 0.05 for NRFR > 0.5, FCAOR = 1 - 1.90*NRFR for NRFR < 0.5"
  qualitative: false
  digitised: false
  source: "Thissen 1978, p. 22, Eq. 2.16-2.17 and Fig. 2.5 (values stated in text)"
  version: *ver

- case: B3-3b
  finding: "Decline phase (NRFR below 0.5, FIOAI about 0.32 after 2000): the relative growth rate of industrial capital is fully set by the fraction of resources remaining, and the relative depletion rate of NR is set only by IC. Capital rises while NRFR exceeds q/p in magnitude and declines below it; NRFR can only fall."
  type: dominant_loop
  phase: "after about 2000, NRFR < 0.5"
  value: "IC_dot/IC = 0.20*NRFR - 0.071 per yr (p = 0.20, q = -1/ALIC = -0.071); NR_dot/NR = -0.034*IC/NRI (r = -0.034)"
  qualitative: false
  digitised: false
  source: "Thissen 1978, p. 24, Eq. 2.23-2.30 (FIOAI = 0.32, ICOR = 3, ALIC = 14)"
  version: *ver

- case: B3-3b
  finding: "Law of total industrial output: because resource use is proportional to industrial output (IOPC below about 600) and the resource stock is finite, the area under the IO curve cannot exceed NR(1900)/a132. Anything that speeds early capital growth gives an earlier and sharper drop; moderating growth prolongs it and makes decline gradual. IC tends to zero even before all resources are exhausted."
  type: core_structure
  phase: "whole run"
  value: "integral of IO dt <= NR(1900)/a132, with a132 = 0.0053 and NRI = 1e12 (Table 2.2, p. 20)"
  qualitative: false
  digitised: false
  source: "Thissen 1978, p. 21, Eq. 2.9; p. 20, Table 2.2; p. 26"
  version: *ver

- case: B3-3b
  finding: "Capital-and-resource submodel reduces to three states (IC, SC, NR). Population has no direct influence in standard-run conditions because PCRUM and ISOPC are nearly proportional to IOPC for IOPC below 400; holding POP constant at 2e9 or 4e9 leaves behaviour almost unchanged. Resource-usage and service-allocation effects of POP appear only at IOPC below about 50 or above about 800."
  type: reduction_size
  phase: "standard run (IOPC 0-400)"
  value: "3 state equations (Table 2.2); POP held at 2e9 and 4e9: almost the same behaviour; POP matters for IOPC < 50 or > 800 (a132 -> 0 above IOPC 1400)"
  qualitative: false
  digitised: false
  source: "Thissen 1978, p. 18-19, Sec. 2.2.2-2; p. 20, Table 2.2; p. 27-29, Sec. 2.2.2-4 and 2.2.2-5"
  version: *ver

- case: B3-3b
  finding: "The job subsector can be removed for standard-run behaviour: CUF departs from 1 only slightly in the first two years after 1900 and in 2070-2100, and setting CUF = 1 throughout leaves behaviour virtually unaffected. It becomes active only with labour shortage (IC/POP above about 4500, i.e. IOPC about 1400 or more), where CUF is a very sensitive parameter for capital growth. The urban-industrial land submodel is also dormant."
  type: reduction_size
  phase: "standard run; active only at high IOPC or high AIPH"
  value: "CUF set to 1 for the whole run: behaviour virtually unaffected; CUF < 1 when industrial capital/population ratio > about 4500 (IOPC >= about 1400)"
  qualitative: false
  digitised: false
  source: "Thissen 1978, p. 18, Sec. 2.2.2-2; p. 27; p. 71, Sec. 2.3.2-1; p. 96, Sec. 3.1"
  version: *ver

- case: B3-3b
  finding: "Parameter sensitivity of the capital-and-resource submodel: behaviour is most sensitive to the parameter groups acting directly on industrial output (CUF, ICOR), on the allocation of output to reinvestment (FIOAC) and on industrial capital depreciation (ALIC). Variations in other parameters, including resource usage and resource availability, have less effect and act only after resources are more than 40 percent used (FCAOR rising). Freezing FIOAA at 0.12 (range 0.10-0.16) changes little; 0.16 gives faster early growth and an earlier turning point."
  type: leverage_parameter
  phase: "standard run, capital growth phase"
  qualitative: true
  source: "Thissen 1978, p. 19, Sec. 2.2.2-2; p. 20, Sec. 2.2.2-2"
  version: *ver

- case: B3-3b
  finding: "Agricultural submodel, standard-run freezes and omissions that change F and FIOAA little: PPOLX frozen at any value below 10; FALM frozen at 0.06 (it varies 4-7 percent); FIALD frozen at 0.19 (varies 0.003-0.26); LER = LRUI = 0 (their total effect is about 10 percent of AL in 2100); LFERT frozen at 570 (changes mainly in 2020-2070); LYMAP is 1 while IO stays below ten times its 1970 value. Freezing POP from 1970 leaves F largely unaffected but changes FIOAA; freezing IO from 1970 hardly changes FIOAA but changes F."
