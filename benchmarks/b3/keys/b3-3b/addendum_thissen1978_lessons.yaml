  finding: "Carrying capacity: the maximum equilibrium population with no resource scarcity is about 12,000 million (about 1/7 of the roughly 80,000 million implied by maximum arable land times maximum land yield), because high agricultural investment raises pollution and cuts land fertility. Once industrial and service output decline to zero the maximum sustainable population is about 3,000 million (land erosion ignored); the only sustainable steady state of the capital-resource submodel is zero capital."
