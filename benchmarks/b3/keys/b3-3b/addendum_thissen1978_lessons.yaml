  phase: "standard run, freezes from 1900 or 1970"
  value: "PPOLX < 10; FALM = 0.06; FIALD = 0.19; LER = LRUI = 0 (about 10 percent of AL in 2100); LFERT = 570; LYMAP = 1 for IO < 10 x 1970 value"
  qualitative: false
  digitised: false
  source: "Thissen 1978, p. 34-35, Sec. 2.2.3-2 and Fig. 2.10 (values stated in text)"
  version: *ver

- case: B3-3b
  finding: "Under standard-run conditions the agricultural submodel acts algebraically except for the integration of the land development rate into AL (and PAL). Land-fertility lag (below 5 yr) and the 2-yr lags (CAI to AI, FR to PFR) can be dropped: removing them, or replacing LFERT by its steady state, gives results virtually identical to the original standard run; new equilibria after input steps are reached within 5 years. F depends mainly on IO and AL, FIOAA mainly on POP (IO and AL effects nearly cancel)."
  type: reduction_size
  phase: "standard run (input changes over 20 years or more)"
  value: "lags removed: land fertility < 5 yr, CAI-AI and FR-PFR 2 yr; equilibrium reached within 5 yr; only one dynamic element left (integral of LDR)"
  qualitative: false
  digitised: false
  source: "Thissen 1978, p. 38-40, Sec. 2.2.3-3; p. 45-46, Sec. 2.2.3-6"
  version: *ver

- case: B3-3b
  finding: "Outside standard-run conditions the agricultural submodel changes character once PPOLX exceeds 10: the loop LFERT to F to FPC to FR to FALM to LFERT can have gain above +1 with a 2-yr lag, giving two coexisting equilibria, rapid jumps in food production, large inertia or self-started growth or decline. Steady-state F falls when POP exceeds about 4e9 and is very sensitive to PPOLX between 10 and 20; for PPOLX above 15, FPC is either above 2.5 times SFPC or below SFPC. Land-fertility degradation saturates at PPOLX = 30. These dormant parts must be kept when the model leaves the standard run."
  type: dominant_loop
  phase: "non-standard conditions, PPOLX > 10"
  value: "threshold PPOLX = 10 (regime change); PPOLX = 15 (bistable FPC); PPOLX = 30 (LFDR constant above); POP above about 4e9; loop lag 2 years"
  qualitative: false
  digitised: false
  source: "Thissen 1978, p. 41-43, Sec. 2.2.3-4 and Fig. 2.13 (values stated in text); p. 44-45, Sec. 2.2.3-5"
  version: *ver

- case: B3-3b
  finding: "Persistent-pollution submodel: in the standard run PPOLX stays below 12, so its lag time is under 5 yr and the stock equation can be replaced by the algebraic steady-state relation without changing behaviour; PPOLX then simply follows pollution generation, which is proportional to IO (PPGIO to IO, PPGAO to AI*(1-FALM)). Each source supplies about half of 1970 generation. Lag time grows with PPOLX (over 50 yr at PPOLX = 100). A 20-yr third-order delay lies between generation and appearance."
  type: reduction_size
  phase: "standard run (PPOLX < 12)"
  value: "lag time TPPOL < 5 yr for PPOLX < 12; > 50 yr at PPOLX = 100; delay 20 yr (3 x 20/3); each of PPGIO and PPGAO about half of 1970 generation"
  qualitative: false
