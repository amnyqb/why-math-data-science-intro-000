- case: B3-3b
  finding: "Total linearisation procedure applied to the 1970 standard-run state: state vector reduced from 29 to 21 by replacing each third-order lag by an equivalent first-order lag (does not affect standard-run behaviour); Jacobian by 5 percent perturbations; influence matrix B_ij = A_ij * (change of x_j over 1970-2000); binary link matrix with a link kept when |B_ij| is at least 0.2 times the largest element of row i; reordered to block-triangular form to give the hierarchy. The reduced linear model reproduces the original for about 30 years. Result: the capital variables IC, SC and AI dominate and their growth drives the rest; AI and IC interact strongly."
  type: reduction_size
  phase: "1970-2000 growth phase"
  value: "29 -> 21 state variables; perturbation 5 percent; link threshold 0.2 x row max; delta t 30 yr (1970-2000)"
  qualitative: false
  digitised: false
  source: "Thissen 1978, p. 76-77, Sec. 2.3.3 and Fig. 2.27 (parameters stated in text)"
  version: *ver

- case: B3-3b
  finding: "Eigenvalues of the 1970 linearised World3 (21 states): one dominant positive eigenvalue, two non-negative very small ones, and the rest with negative real parts. The IC-SC-AI submatrix carries an eigenvalue very close to the dominant one (capital leads growth); the population submatrix has one very small positive eigenvalue (slightly positive population feedback around 1970)."
  type: dominant_loop
  phase: "1970 state, growth phase"
  value: "dominant +0.027 per yr; two small non-negative ones of order 1e-3 and 1e-4; negative real parts between -0.05 and -0.98"
  qualitative: false
  digitised: false
  source: "Thissen 1978, p. 78-79, Sec. 2.3.3"
  version: *ver

- case: B3-3b
  finding: "Cautions on the linearisation method: smaller perturbations than 5 percent give no significant change, larger ones give a different linear model (lower population growth, larger AL); no general rule exists for the binary-link criterion (comparison with row maximum worked best at 1970, row sum may be better when large terms offset each other); linearisation can mask nonlinearities (example F = x*y at the origin) and its results must be tested against the nonlinear model."
  type: behaviour
  phase: "method note, 1970 state"
  qualitative: true
  source: "Thissen 1978, p. 77-80, Sec. 2.3.3"
  version: *ver

