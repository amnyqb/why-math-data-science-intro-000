- case: B3-3b
  finding: "Policy found from understanding the hierarchy: reallocating part of industrial output to resource conservation (FIOARC rising to 0.11 by 2000, resource use reduced as NR_reduced = NR_original * exp(-E * FIOARC), E = 10 in the run; E of at least 8.6 needed for a 30 percent target at FIOARC = 0.14), together with a lower desired family size normal (DCFSN from 4.0 to 3.3 over 1975-2000, a 17.5 percent cut; about 3.2 suffices for equilibria), postpones decline beyond 2100: IO growth stops near 1.5e12 and POP stays slightly below 6,000 million, using the full model with four age groups and the full agricultural sector. Delaying the population policy beyond 2000 makes a slight POP decline unavoidable unless IO is held above 3.0e12 and PPOLX below 10."
