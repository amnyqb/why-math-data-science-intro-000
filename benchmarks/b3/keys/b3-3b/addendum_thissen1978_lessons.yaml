- case: B3-3b
  finding: "Population feedback: with ample food and high income the net feedback of POP on its own growth is positive (instability, exponential growth); as food becomes scarce it turns negative and POP tends to a size set by food. The sign coefficient b_m is positive for FPC above about 500 (m = F/SO = 4) down to about 250 (m = 0.25), and positive for any combination with SOPC above 1000 and FPC above 500."
  type: dominant_loop
  phase: "growth phase (food ample) versus decline phase (food scarce)"
  value: "b_m > 0 for FPC > about 500 (m = 4) to about 250 (m = 0.25); b > 0 for SOPC > 1000 and FPC > 500"
  qualitative: false
  digitised: false
  source: "Thissen 1978, p. 62-64, Sec. 2.2.5-3, Eq. 2.66-2.71"
  version: *ver

- case: B3-3b
  finding: "Population equilibrium depends primarily on food production F, about F divided by the subsistence level. Equilibrium growth is negative at any SOPC for FPC below about 180 and positive for FPC above about 400, so natural equilibrium without age structure occurs only near subsistence (starvation) or at high pollution. SO and IO matter little; PPOLX matters only above about 40. If inputs were stabilised before 2020, POP would grow to about twice its value at stabilisation, and after 2060 POPE falls below POP."
  type: behaviour
  phase: "decline phase and long-run equilibrium"
  value: "POPE about F/220 (text p. 61; SFPC = 230 on pp. 33 and 51); RGPst = 0 for FPC between about 180 and 400; PPOLX > about 40 needed to matter; about twice the 1970s-2020 stabilisation level; POPE < POP after 2060"
  qualitative: false
  digitised: false
  source: "Thissen 1978, p. 59-61, Sec. 2.2.5-3 and Fig. 2.21-2.22 (values stated in text)"
  version: *ver

