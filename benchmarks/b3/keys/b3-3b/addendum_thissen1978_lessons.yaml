  source: "Thissen 1978, p. 46-47, Sec. 2.2.4-1; p. 49-50, Sec. 2.2.4-2 and 2.2.4-3, Eq. 2.58-2.60"
  version: *ver

- case: B3-3b
  finding: "Pollution assimilation is capped, so pollution grows without bound when appearance rate relative to 1970 reaches 11.9 or more, and rises disproportionately below that because average lifetime increases with pollution (a145 = 0.084, b145 = 2.016). This nonlinear stock is why high-IO runs show sudden pollution outbreaks."
  type: behaviour
  phase: "high pollution (PPOLX above about 12), non-standard conditions"
  value: "maximum assimilation 11.9 times the 1970 pollution stock per year; unbounded growth for ppapr >= 11.9"
  qualitative: false
  digitised: false
  source: "Thissen 1978, p. 48, Sec. 2.2.4-2, Eq. 2.57-2.59 and Fig. 2.15 (value stated in text)"
  version: *ver

- case: B3-3b
  finding: "Population submodel in the standard run is determined by food and services acting on the death rate and by family income expectation acting on the birth rate; pollution has virtually no influence (LMP within 2 percent of unity because PPOLX stays below 12). MTF, CMPLE, SFSN, FCE and LMC are weak and can be simplified; FIE, the SOPC and FPC effects on LE, and the lags (the 3-yr AIOPC lag most) are not negligible; omitting all linear lags is significant. Combined effect of all lags is to raise RGP by about 0.4 percent per percent growth of per capita variables, giving RGP about 0.7 times RGPst."
