- case: B3-3b
  finding: "Conclusion on the Meadows team policy analysis: only two types of changes (resource conservation and birth-rate reduction) are needed, whereas the Meadows team, by trial and error against successive immediate causes (resource scarcity, pollution, food), concludes that growth must be stopped and many additional changes made (resource use, pollution generation, land yield, land maintenance, capital lifetimes)"
