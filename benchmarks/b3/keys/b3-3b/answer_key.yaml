- case: B3-3b
  finding: In the standard run the job sector (labour shortage via CUF) can be ignored, since global labour excess has no influence in the model; changes in population size hardly affect capital growth or resource usage; FIOAA is the only variable that effectively influences the capital and resource sector from outside and its standard-run variation is slight
  type: reduction_size
  qualitative: true
  source: Thissen 1978, p. 173 (Section II-A) and p. 174 (Section III-B1)
  version: World3 as in Meadows et al. 1974, Dynamics of Growth in a Finite World
- case: B3-3b
  finding: Industrial capital IC and service capital SC are close-coupled with very similar behaviour, so they can be treated as one "capital" (and service plus industrial output as "output")
  type: reduction_size
  qualitative: true
  source: Thissen 1978, p. 173 (Section II-A)
  version: World3 as in Meadows et al. 1974, Dynamics of Growth in a Finite World
