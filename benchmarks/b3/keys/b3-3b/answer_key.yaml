- case: B3-3b
  finding: Decisive determinants found are industrial output (resource use and pollution generation), the persistent-pollution effect on land fertility, and total fertility via DCFSN
  type: leverage_parameter
  qualitative: true
  source: Thissen 1978, pp. 178-179 (Section III-D, Figs. 6 and 7) and p. 180 (Section IV-B)
  version: World3 as in Meadows et al. 1974, Dynamics of Growth in a Finite World
- case: B3-3b
  finding: The paper rejects the Meadows explanation of overshoot, since only zero output is sustainable the term "overshoot" is misleading, and decline cannot be explained by erosion of carrying capacity owing to overshoot because resource depletion is the cause; except for land erosion and urban-industrial land removal, changes in the other limits (pollution assimilation, land yield) are fully reversible in the model
  type: dominant_loop
  qualitative: true
  source: Thissen 1978, p. 179 (Section III-E, end)
  version: World3 as in Meadows et al. 1974, Dynamics of Growth in a Finite World
- case: B3-3b
  finding: "Simple stabilising policy, two changes only: (1) allocate part of industrial output to resource conservation (FIOARC) so the resource usage rate falls, which also moderates capital growth and pollution generation, and (2) reduce desired completed family size (DCFSN) so population growth stops before starvation. Introduced gradually 1975 to 2000, it postpones decline of capital and population until after 2100, and is claimed to be much simpler and less far-reaching than the Meadows team recommendations"
  type: policy
  phase: introduced 1975 to 2000; outcome to after 2100
  qualitative: true
  source: Thissen 1978, p. 172 (abstract), p. 180 (Section IV-C) and p. 181 (Section IV-C, Fig. 8, Eqs. 5 to 8)
  version: World3 as in Meadows et al. 1974, Dynamics of Growth in a Finite World
- case: B3-3b
  finding: "Policy parameters of the simulated run in Fig. 8: FIOARC ramps from 0 in 1975 to 0.11 in 2000 (the slope printed in Eq. 6 is 0.044 per year, which would reach 0.11 in under three years, so it is probably a misprint; the end value 0.11 is the one of the Fig. 8 caption) with effectiveness E = 10 in NRreduced = NR * exp(-E * FIOARC); DCFSN falls from 4.0 in 1975 to 3.3 in 2000, then stays; FIOAI = 1 - FIOAA - FIOAC - FIOAS - FIOARC"
  type: policy
