# B3-3b World3 (1974 version). Entries come from Thissen 1978 (IEEE SMC-8(3), pp. 172-182), text file read in full (papers/thissen1978.txt).
# Page numbers are the journal pages. No figure was digitised: every number below is stated in the text or an equation.
# Figure 1 (standard run) is cited only for what the text says about it.
- case: B3-3b
  finding: In the standard run every central variable except NR (nonrenewable resources remaining) shows growth followed by decline, with the decline setting in during the first half of the 21st century
  type: behaviour
  phase: decline in first half of the 21st century
  qualitative: true
  source: Thissen 1978, p. 173 (Section III-A, text on Fig. 1)
  version: World3 as in Meadows et al. 1974, Dynamics of Growth in a Finite World
- case: B3-3b
  finding: The capital and resource subsystem plays the leading part and impresses its growth-then-decline behaviour on all other subsystems, directly through industrial and service output and indirectly through agriculture (IO to F, and persistent pollution generated by agricultural output); the feedback via POP and FIOAA is weak
  type: dominant_loop
  qualitative: true
  source: Thissen 1978, p. 172 (abstract) and p. 173 (Section III-A, Fig. 2)
  version: World3 as in Meadows et al. 1974, Dynamics of Growth in a Finite World
- case: B3-3b
  finding: Neglecting the weak influences, the subsystems form a three-level hierarchy for standard-run conditions, with capital and resources autonomous and dominant, agriculture in the middle, and population and persistent pollution at the third level
  type: core_structure
  qualitative: true
  source: Thissen 1978, p. 173 (Section III-A, Fig. 2)
  version: World3 as in Meadows et al. 1974, Dynamics of Growth in a Finite World
- case: B3-3b
  finding: Freezing industrial and service output at 1970 values removes growth and decline from the agricultural, population and pollution sectors, which come to rest; freezing population or pollution from 1970 hardly changes the growth-and-decline mode of the capital and agricultural sectors; freezing food production F in 1970 changes population but leaves capital and pollution virtually unchanged
  type: behaviour
  qualitative: true
  source: Thissen 1978, p. 174 (Section III-A, Fig. 3 and text)
  version: World3 as in Meadows et al. 1974, Dynamics of Growth in a Finite World
- case: B3-3b
  finding: Capital growth is roughly exponential while resources are sufficient, and capital declines when more than about 60 percent of the initial resources have been used up; resource usage is roughly proportional to output, so decline is inevitable in the long run, and changes in a number of parameters may change the capital growth rate but will not prevent the ultimate decline
  type: dominant_loop
  qualitative: true
  source: Thissen 1978, p. 173 (Section II-A)
  version: World3 as in Meadows et al. 1974, Dynamics of Growth in a Finite World
- case: B3-3b
  finding: Resource scarcity, from excessive resource use particularly between 2000 and 2050, is the primary reason for decline in the standard run
  type: dominant_loop
  phase: resource use between 2000 and 2050
  qualitative: true
  source: Thissen 1978, p. 180 (Section IV-B)
  version: World3 as in Meadows et al. 1974, Dynamics of Growth in a Finite World
