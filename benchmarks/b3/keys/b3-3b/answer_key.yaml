- case: B3-3b
  finding: Nonstandard conditions that make dormant parts active include an active job sector (labour shortage at low AIPH, or at industrial-capital/population above roughly 4500, IOPC about 1400 or more), high land yields (above about six times inherent fertility), high industrial output (LYMAP above ten times the 1970 IO; urban-industrial land loss above about five times), high or low output per capita, and high persistent pollution (PPOLX above 10, with LMP below 0.9 above PPOLX 40 and 0.2 above 100)
  type: core_structure
  qualitative: true
  source: Thissen 1978, pp. 174-175 (Section III-B1 to B6)
  version: World3 as in Meadows et al. 1974, Dynamics of Growth in a Finite World
- case: B3-3b
  finding: "Test with unlimited resources (FCAOR set to 0.05): capital and output grow exponentially, a pollution explosion follows around the middle of the 21st century (PPOLX peak about 110, land fertility falls to about 6 percent of initial) and population falls from nearly 9e9 in 2050 to under 3e9 in 2100; after oscillations, a second pollution peak (about 250) takes population below 1e9 in 2210; labour shortage stops capital growth around 2170; population settles near 1.2e9 at FPC above 1000 and IOPC above 2000"
  type: behaviour
  phase: 2050 to 2210
  qualitative: true
  source: Thissen 1978, pp. 175-176 (Section III-B7, Fig. 4)
  version: World3 as in Meadows et al. 1974, Dynamics of Growth in a Finite World
