  finding: Sustainable population falls sharply for industrial output above 1.7e12 because of persistent pollution acting on land fertility; for IO below 1.5e12 it rises with IO; sustained oscillations (period 100 to 150 years) occur at IO of 3.0e12, 3.1e12 and 3.4e12
