  finding: Reducing pollution generation raises the maximum sustainable population but equilibrium is still starvation; making the desired completed family size norm DCFSN fall with food per capita (from 4 to 1 as FPC/SFPC falls from 3 to 1) gives equilibria at much higher FPC, with maximum equilibrium population about 6e9, and DCFSN reduced to about 3.3 is sufficient except for IO below 0.4e12
