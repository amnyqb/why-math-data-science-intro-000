  finding: Method used to simplify the linear model, and a caution; links with B_ij below 0.2 of the largest absolute element in the row are dropped. The author warns that linearisation may mask crucial nonlinearities and that such simplification may delete influential elements, so a result is a hypothesis to be tested on the original model
