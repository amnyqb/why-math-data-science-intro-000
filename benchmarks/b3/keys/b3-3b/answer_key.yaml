- case: B3-3b
  finding: Sensitivity of the policy; later resource policy or less effective conservation brings decline earlier; delaying the population policy past 2000 makes a slight population decline inevitable unless some additional policy holds IO above 3.0e12 and PPOLX below 10; more resources or higher E allow larger income, longer constant income, or spending on other goals such as pollution reduction
  type: policy
