- case: B3-3b
  finding: Total linearisation at the 1970 state (state variables 1970 to 2000) shows the capital variables IC, SC and AI playing a dominant part in the growth phase and influencing all other model parts; the strong interaction between AI and IC runs through FIOAA; a simplified linear model keeping only the links of Fig. 5 behaves very like the full linear model for about 30 years
