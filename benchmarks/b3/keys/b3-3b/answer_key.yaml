- case: B3-3b
  finding: If the resource policy yields sustainable output above three times the 1970 output, reduction of persistent pollutant generation would also be desirable; the paper calls the policy robust to modifications in assumptions and sufficient to change behaviour basically for the next 125 years
  type: policy
  qualitative: true
