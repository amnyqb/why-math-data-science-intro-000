- case: B3-3b
  finding: "Perturbation test 1 (Fig. 1): changing in 1980 ICOR up 10%, ALIC down 10%, FIOAC up 10%, and every output of the CUF table down 10% of its 1980 value avoids the population collapse of the Reference Run, at the cost of dramatically reduced industrial output per capita; nonrenewable resources remaining are more than double the Reference Run and persistent pollution stays manageable. Opposite 10% changes give results more disastrous than the Reference Run."
