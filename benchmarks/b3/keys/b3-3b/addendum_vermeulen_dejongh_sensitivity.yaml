- case: B3-3b
  finding: "Conclusion on Meadows conclusion 2 (inevitable decline of industry and population): not supported; the same model gives qualitatively very different results if only some parameters and table functions are changed by as little as two per cent each. Small perturbations in one part produce much bigger changes in others, so the model is dynamically unstable in this sense."
