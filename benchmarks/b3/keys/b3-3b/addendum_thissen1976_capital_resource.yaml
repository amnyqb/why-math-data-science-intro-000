  version: "World3, ultimate version of Meadows et al. 1974; standard run"

- case: B3-3b
  finding: "Eight parameter groups act identically in the simplified model: (1) 1-FIOAA-FIOAC, (2) b_fi, (3) CUF, (4) (1-FCAOR)/ICOR, (5) ALIC, (6) a_fi/(a_is*SCOR), (7) ALSC, (8) a_pc*NRUF."
  type: core_structure
  value: "8 parameter groups"
  qualitative: false
  digitised: false
  source: "Thissen, 1976, p. 459, Section V-A (Parameter Groups), Table V"
  version: "World3, ultimate version of Meadows et al. 1974; standard run"

- case: B3-3b
  finding: "Sensitivity (original equations): the outcome is very sensitive to parameter group 1 (1-FIOAA-FIOAC, i.e. FIOAC and FIOAA); similar sensitivity for the groups (1-FCAOR)/ICOR, CUF and ALIC. Variations in other parameters have less effect."
  type: leverage_parameter
  qualitative: true
  source: "Thissen, 1976, p. 459, Section V-B (Sensitivity Tests), Fig. 6"
  version: "World3, ultimate version of Meadows et al. 1974; standard run"

- case: B3-3b
  finding: "A change in a_pc*NRUF initially affects only NR and influences other variables only after resources have been used for more than 40 percent of their initial value and FCAOR begins to rise. Larger variations only give more pronounced effects."
  type: leverage_parameter
  qualitative: true
  source: "Thissen, 1976, pp. 459-460, Section V-B"
  version: "World3, ultimate version of Meadows et al. 1974; standard run"

- case: B3-3b
  finding: "Total industrial output over time is bounded: the integral of IO from 1900 to infinity equals (NR(1900) - NR(infinity))/a_pc <= NR(1900)/a_pc; changes causing earlier and faster capital growth lead to a more sudden, faster and earlier drop; moderated growth gives a longer growth and more gradual decline. This follows from PCRUM being nearly linear in IOPC."
  type: dominant_loop
  qualitative: true
  source: "Thissen, 1976, p. 460, Section V-C, equations (8)-(10)"
  version: "World3, ultimate version of Meadows et al. 1974; standard run"

- case: B3-3b
  finding: "The service-capital subsystem (SC) can be regarded as a single-input (IO), single-output (FIOAS) transfer system acting as a feedback loop on IC, and acts in a stabilising way with respect to outside disturbances; FIOAS reacts immediately to sudden changes in FCAOR and later to FIOAA."
  type: dominant_loop
  qualitative: true
  source: "Thissen, 1976, pp. 460-461, Section VI-A, Figs. 7, 8"
  version: "World3, ultimate version of Meadows et al. 1974; standard run"

- case: B3-3b
  finding: "SC behaves as a linear first-order system with IO as input: time constant T_s = 6 years if SC < a_is*IO, 9 years if SC > a_is*IO, and static gain 1.8 (= b_fi * T_s)."
  type: core_structure
  value: "T_s = 6 years (SC < a_is*IO) or 9 years (SC > a_is*IO); static gain 1.8"
  qualitative: false
  digitised: false
  source: "Thissen, 1976, p. 461, Section VI-A, equations (11)-(13)"
  version: "World3, ultimate version of Meadows et al. 1974; standard run"

- case: B3-3b
  finding: "During the growth phase (NRFR > 0.5) with FIOAA constant, FIOAS can be approximated by a first-order system, linearised around FIOAS = 0.122 with time constant of approximately 5 years (4.8) and static value FIOAS_stat = 0.122 + 0.22*(U - 0.45); FIOAS rises as U rises, partially compensating the effect of U on capital growth."
  type: core_structure
  value: "time constant 4.8 years (about 5); FIOAS_stat = 0.122 + 0.22*(U - 0.45); linearisation point FIOAS = 0.122, U = 0.45"
  qualitative: false
  digitised: false
  source: "Thissen, 1976, p. 462, Section VI-B, equations (19)-(24)"
  version: "World3, ultimate version of Meadows et al. 1974; standard run"

