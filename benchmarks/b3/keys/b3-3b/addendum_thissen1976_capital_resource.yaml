# Addendum key, case B3-3b. Thissen 1976, IEEE SMC 6(7), pp. 455-466 (printed page numbers).
# Text read from papers/Thissen-1976-capital-resource.txt. Figure-only content (Figs. 1, 4, 5, 6, 10, 12) is not digitised.
- case: B3-3b
  finding: "The capital and resource sector is the motor of the model; its growth-then-decline behaviour is imposed on all other sectors, and the retroaction (via allocation of industrial output to agriculture) is of little importance."
  type: core_structure
  qualitative: true
  source: "Thissen, 1976, p. 456, Section II (and Abstract, p. 455)"
  version: "World3, ultimate version of Meadows et al. 1974 (Dynamics of Growth in a Finite World); standard run"

- case: B3-3b
  finding: "Capital and resources submodels interact heavily under standard-run and similar conditions and are treated as one sector, with three state variables IC, SC, NR."
  type: core_structure
  qualitative: true
  source: "Thissen, 1976, p. 456, Section II and Table I"
  version: "World3, ultimate version of Meadows et al. 1974; standard run"

- case: B3-3b
  finding: "Capital and population peak in the middle of the 21st century then decline in the standard run; the decline is mainly caused by scarcity of resources."
  type: behaviour
  qualitative: true
  source: "Thissen, 1976, p. 455, Section II, Fig. 1"
  version: "World3, ultimate version of Meadows et al. 1974; standard run"

- case: B3-3b
  finding: "Exponential growth of the economic variables is caused by the assumptions on capital productivity and by the lack of any influence of resource scarcity while not more than 40 percent of initial resources have been used."
  type: dominant_loop
  qualitative: true
  source: "Thissen, 1976, p. 465, Section VIII"
  version: "World3, ultimate version of Meadows et al. 1974; standard run"

- case: B3-3b
  finding: "Decline is inevitable because nonrenewable resources are limited and resource use is proportional to industrial output; collapse is enforced by the sharp drop in capital productivity (FCAOR rise) once more than 50 percent of initial resources are used, while FIOAC is not diminished."
  type: dominant_loop
  qualitative: true
  source: "Thissen, 1976, p. 465, Section VIII"
  version: "World3, ultimate version of Meadows et al. 1974; standard run"

- case: B3-3b
  finding: "Growth turns to decline around 2025 owing to the fast rise of FCAOR (standard-run trajectory in the FIOAA-FCAOR plane); no growth is possible once FCAOR exceeds 0.5."
  type: behaviour
  phase: "around 2025"
  value: "growth turns to decline around 2025; no growth if FCAOR > 0.5"
  qualitative: false
  digitised: false
  source: "Thissen, 1976, p. 463, Section VI-C, Fig. 10"
  version: "World3, ultimate version of Meadows et al. 1974; standard run"

- case: B3-3b
  finding: "First-round simplification: CUF can be set to 1 (it is exactly 1 until 2070 and differs only slightly from 1 from 2070 to 2100 in the standard run), eliminating one input variable (job sector) of the sector."
  type: reduction_size
  qualitative: true
  source: "Thissen, 1976, p. 457, Section IV"
  version: "World3, ultimate version of Meadows et al. 1974; standard run"

- case: B3-3b
  finding: "Table functions depending on IOPC are mostly unused in the standard run, since IOPC varies only between 0 and 400 dollars per head per year; ISOPC and PCRUM can be approximated as proportional to IOPC."
  type: reduction_size
  value: "IOPC between 0 and 400 dollars/person-year; PCRUM = 0.0053 * IOPC; ISOPC = 1.67 * IOPC"
  qualitative: false
  digitised: false
  source: "Thissen, 1976, pp. 457-458, Section IV, equations (1) and (2), Fig. 3"
  version: "World3, ultimate version of Meadows et al. 1974; standard run"

- case: B3-3b
  finding: "With PCRUM and ISOPC proportional to IOPC, population POP has no direct influence on the capital and resource sector (NRUR = a_pc * IO); test calculations (Fig. 4) confirmed this. The only external variable that matters is FIOAA; the subsystem is virtually independent of population."
  type: leverage_parameter
  qualitative: true
  source: "Thissen, 1976, p. 458, Section IV, equations (3), (4), Fig. 4"
  version: "World3, ultimate version of Meadows et al. 1974; standard run"

- case: B3-3b
  finding: "Piecewise-linear simplification of FIOAS: a_fi = -0.20, b_fi = 0.30 if SOPC < ISOPC and a_fi = -0.10, b_fi = 0.20 if SOPC > ISOPC; a fully linear version a_fi = -0.13, b_fi = 0.24 introduces no significant change in standard-run behaviour."
  type: reduction_size
  value: "a_fi = -0.13, b_fi = 0.24 (fully linear); -0.20/0.30 and -0.10/0.20 (two-part)"
  qualitative: false
  digitised: false
  source: "Thissen, 1976, p. 458, Section V, equations (5) and (6)"
  version: "World3, ultimate version of Meadows et al. 1974; standard run"

- case: B3-3b
  finding: "FCAOR is broken into two parts: FCAOR = 0.05 if NRFR > 0.5, and FCAOR = 1 + a_fc * NRFR with a_fc = -1.90 if NRFR < 0.5; the simplification does not significantly affect model behaviour."
  type: reduction_size
  value: "FCAOR = 0.05 (NRFR > 0.5); a_fc = -1.90 (NRFR < 0.5)"
  qualitative: false
  digitised: false
  source: "Thissen, 1976, p. 458, Section V, equation (7); p. 459, Table IV"
  version: "World3, ultimate version of Meadows et al. 1974; standard run"

- case: B3-3b
  finding: "The simplified sector model (Table IV: three state equations for IC, SC, NR with input FIOAA only, CUF = 1, linear PCRUM, ISOPC, FIOAS and two-part FCAOR) reproduces the standard run with only slight differences (Fig. 5)."
  type: reduction_size
  value: "3 state variables (IC, SC, NR); 1 input variable (FIOAA)"
