- case: B2-2F
  finding: The sales growth loop (loop 1 of his Fig. 8, reinforcing, through Salesmen and Orders Booked) dominates and creates the growth trend of the cycles in Backlog
  type: dominant_loop
  qualitative: true
  source: Mojtahedzadeh 2015, p. 14 (end of Pathway Participation Analysis of Unstable Growth)
  version: Forrester 1968 Market Growth as analysed in Mojtahedzadeh 2015, Fig. 10
- case: B2-2F
  finding: The delivery delay loop (loop 2) and the capacity expansion loop (loop 3) together explain the crossings of capacity and order rate ("high delivery delay simultaneously causes the expansion of capacity and the suppression of orders")
  type: dominant_loop
  qualitative: true
  source: Mojtahedzadeh 2015, p. 14
  version: Forrester 1968 Market Growth as analysed in Mojtahedzadeh 2015, Fig. 10
- case: B2-2
  finding: The utilisation of capacity hardly deviates from its initial value, so it can be excluded; eliminating it gives a run virtually identical to the reference run (the loops that contain it, loops 10 and 17, are the best candidates for superfluous structure)
  type: reduction_size
  qualitative: true
  source: Phaff et al. 2008, p. 15 (Section 4.1, Table 1 and the text after it)
  version: Market Growth model of Forrester 1968 and Morecroft 1983 as used by Phaff et al. 2008, Fig. 3 (overshoot and collapse)
