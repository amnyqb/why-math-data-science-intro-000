[package]
name = "dynamist"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "core", "cli"]

[features]
# `gui` = the desktop window (eframe, file dialogs, clipboard). Without it the crate is a library
# that draws sheets and charts with egui's headless Context: no display, no winit, no eframe.
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:arboard", "dep:winit", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]

[lib]
name = "dynamist"
path = "src/lib.rs"

[[bin]]
name = "dynamist"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
dynamist-core = { path = "core" }
eframe = { version = "0.37", optional = true }
egui_plot = "0.38"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = { version = "0.18", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# the bundled fonts (eframe turns this on for the window; the headless build must ask for it)
egui = { version = "0.37", features = ["default_fonts"] }
ab_glyph = "0.2"
epaint_default_fonts = { version = "0.37", features = ["monochrome_emoji_fonts"] }
png = "0.18"
arboard = { version = "3.7", default-features = false, features = ["image-data"], optional = true }
calamine = "0.38.0"
rust_xlsxwriter = "0.102.0"

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", features = ["NSData", "NSGeometry"], optional = true }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSImage"], optional = true }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
